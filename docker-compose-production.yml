services:
  nest_boilerplate_api:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: nestjs_api
    container_name: nest_boilerplate_api
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api/src:/usr/src/nest/apps/api/src:cached
      - ./apps/redis/src:/usr/src/nest/apps/redis/src:cached
      - ./tsconfig.json:/usr/src/nest/tsconfig.json
      - ./package.json:/usr/src/nest/package.json
      - ./yarn.lock:/usr/src/nest/yarn.lock
      - /usr/src/nest/node_modules
    command: npm run start:dev api
    restart: always
    depends_on:
      - nest_boilerplate_mysql
      - nest_boilerplate_redis
    environment:
      - APP_PORT=3001
      - NODE_ENV=production
      - DOMAIN_NAME=${DOMAIN_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  nest_boilerplate_mysql:
    image: mysql:latest
    container_name: nest_boilerplate_mysql
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 3

  nest_boilerplate_redis:
    image: redis:latest
    container_name: nest_boilerplate_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
