version: "3.9"

services:
  nest_boilerplate_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestjs_api
    container_name: nest_boilerplate_api
    ports:
      - "3001:3001"
    depends_on:
      nest_boilerplate_mysql:
        condition: service_healthy
      nest_boilerplate_redis:
        condition: service_started
    environment:
      APP_PORT: ${APP_PORT}
      NODE_ENV: ${NODE_ENV}
      DOMAIN_NAME: ${DOMAIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}

      DB_HOST: nest_boilerplate_mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@nest_boilerplate_mysql:3306/${DB_NAME}

      REDIS_HOST: nest_boilerplate_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  nest_boilerplate_mysql:
    image: mysql:8.0
    container_name: nest_boilerplate_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nest_boilerplate_redis:
    image: redis:7-alpine
    container_name: nest_boilerplate_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
